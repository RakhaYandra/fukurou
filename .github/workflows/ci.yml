name: ci
on:
  push:
  pull_request:
jobs:
  build:
    # Arch mirrors the dev machine: recent glib (gotk4 v0.4.1 needs it)
    # plus packaged gtk4-layer-shell. No source builds needed.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: system deps
        run: pacman -Syu --noconfirm go gtk4 gtk4-layer-shell gobject-introspection pkg-config gcc git
      - run: gofmt -l .
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
