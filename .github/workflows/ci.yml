name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgtk-3-dev libwayland-dev wayland-protocols gobject-introspection libgirepository1.0-dev valac meson ninja-build
          git clone --depth 1 https://github.com/wmww/gtk-layer-shell /tmp/gtk-layer-shell
          meson setup /tmp/gtk-layer-shell/build /tmp/gtk-layer-shell
          ninja -C /tmp/gtk-layer-shell/build
          sudo ninja -C /tmp/gtk-layer-shell/build install
          sudo ldconfig
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: gofmt -l .
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
